---

- name: Gather Facts for use by Icinga2 role
  gather_facts:
    parallel: yes
  tags:
    - icinga2
    - packages
    - pagerduty

- name: install required gnupg package
  apt: pkg=gnupg state=present
  tags:
    - icinga2
    - packages

- name: Check if Icinga was already installed from debmon
  stat: path=/etc/apt/sources.list.d/debmon_org_debmon.list
  register: icinga_old_package
  tags:
    - icinga2
    - packages

- name: Remove the old Icinga package to force an upgrade
  apt: pkg=icinga2 state=absent
  when: icinga_old_package.stat.exists == True
  tags:
    - icinga2
    - packages

- name: Delete the old Icinga debmon repository
  file: path="/etc/apt/sources.list.d/debmon_org_debmon.list" state=absent
  tags:
    - icinga2
    - packages

- name: Ubuntu | Get Icinga Apt Key
  apt_key:
    url: "https://packages.icinga.com/icinga.key"
    state: present
    keyring: "/etc/apt/trusted.gpg.d/icinga.gpg"
  when: (ansible_facts['distribution'] == "Ubuntu") and (ansible_facts['distribution_major_version'] < "26")
  tags:
    - icinga2
    - packages

- name: Ubuntu | Configure Icinga Apt Repo
  apt_repository:
    repo="deb [signed-by=/etc/apt/trusted.gpg.d/icinga.gpg] http://packages.icinga.com/{{ ansible_facts['distribution']|lower }}  icinga-{{ ansible_facts['distribution_release']|lower }}  main"
    update_cache=yes
    state=present
  when: (ansible_facts['distribution'] == "Ubuntu") and (ansible_facts['distribution_major_version'] < "26")
  tags:
    - icinga2
    - packages

- name: Ubuntu | Add in icinga Apt repo
  deb822_repository:
    name: icinga
    types: deb
    uris: "http://packages.icinga.com/{{ ansible_facts['distribution']|lower }}"
    suites: "icinga-{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://packages.icinga.com/icinga.key
  when: (ansible_facts['distribution'] == "Ubuntu") and (ansible_facts['distribution_major_version'] < "28") and (ansible_facts['distribution_major_version'] > "26")
  tags:
    - icinga2
    - packages

- include_tasks:
    file: main-server.yml
  when: "'icinga_servers' in group_names"
  tags:
    - icinga2
    - icinga2-site-checks
    - icinga2-custom-checks
    - packages
    - pagerduty

- include_tasks:
    file: main-node.yml
  when: "'icinga_servers' not in group_names"
  tags:
    - icinga2
    - icinga2-site-checks
    - icinga2-custom-checks
    - packages
